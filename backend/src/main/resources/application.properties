spring.application.name=portfolio-api
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app-local-only}
spring.flyway.enabled=true
app.jwt-secret=${APP_JWT_SECRET:local-development-secret-change-for-production-256bit}
server.error.include-message=never
